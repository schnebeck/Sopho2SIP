; Rufweg Sopho ⇄ SIP. Die Nummer reist jeweils im passenden Feld:
;   Sopho → SIP: baresip ruft Asterisk mit der ANRUFERNUMMER als Ziel an; hier wird sie zur Caller-ID.
;   SIP → Sopho: Asterisk ruft baresip mit der GEWÄHLTEN NUMMER als Caller-ID an; der Daemon wählt sie.
; Externe Nummern tragen die Amtsholung 01 (wie am Telefon).

[general]
static = yes
writeprotect = yes

[globals]
TELEFONE = PJSIP/tel1&PJSIP/tel2
; Diagnose: beide Sprechrichtungen getrennt aufzeichnen (/var/spool/asterisk/monitor/sopho-*-vom-pi.wav = Anrufer
; nach D340/UCA222/baresip, *-zum-pi.wav = vom Softphone). Zur Laufzeit: asterisk -rx "dialplan set global MITSCHNITT 1"
MITSCHNITT = 0

[von-sopho]
exten => anonymous,1,Set(CALLERID(all)="Anonym" <anonymous>)
 same => n,Goto(klingeln,1)
exten => _[0-9*#].,1,Set(CALLERID(num)=${EXTEN})
 same => n,Set(CALLERID(name)=${EXTEN})
 same => n,Goto(klingeln,1)
exten => klingeln,1,GotoIf($["${MITSCHNITT}" != "1"]?waehlen)
 same => n,Set(DATEI=sopho-${STRFTIME(,,%Y%m%d-%H%M%S)})
 same => n,MixMonitor(${DATEI}.wav,r(${DATEI}-vom-pi.wav)t(${DATEI}-zum-pi.wav))
 same => n(waehlen),Dial(${TELEFONE},60)
 same => n,Hangup()

[von-intern]
exten => _[0-9*#].,1,Set(CALLERID(all)=<${EXTEN}>)
 same => n,Dial(PJSIP/gateway,90)
 same => n,Hangup()
